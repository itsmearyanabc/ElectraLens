# ElectraLens site for the host nginx (S8). Copy to /etc/nginx/sites-available/, link it into
# sites-enabled, then run: certbot --nginx -d electralens.armedias.com
# The website, the API and nothing else are public; the anchor service is never proxied.

limit_req_zone $binary_remote_addr zone=electralens_api:10m rate=10r/s;

# Access log without visitor IPs or query strings (NFR-11, B13.08).
log_format electralens_private '[$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name electralens.armedias.com;

    client_max_body_size 1m;   # file uploads go straight to Supabase Storage, not through here
    server_tokens off;

    # Same-host services only.
    location /internal/ { return 404; }

    location /api/ {
        limit_req zone=electralens_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # approving a publication waits for the on-chain anchor
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    access_log /var/log/nginx/electralens.access.log electralens_private;
}
