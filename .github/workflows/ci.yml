name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: TypeScript workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  database:
    name: Database migrations, RLS and workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - run: supabase start
      - run: supabase db lint --level warning --fail-on warning
      - run: supabase test db

  engine:
    name: Python engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so pin the release by commit.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Failing test names also go out as annotations, which are readable without signing in.
      - run: |
          set +e
          uv run pytest -rfE 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E '^(FAILED|ERROR) ' pytest.log | head -10 | while read -r line; do echo "::error title=pytest::$line"; done
          exit "$status"
        shell: bash
