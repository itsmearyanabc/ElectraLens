[project]
name = "electralens-engine"
version = "0.1.0"
description = "ElectraLens audit engine: synthetic data, canonicalisation, anomaly rules and the publication pipeline."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastjsonschema>=2.22.2",
    "httpx>=0.28",
    "numpy>=2.5.4",
    "opentimestamps>=0.4.5",
    "polars>=2.1.0",
    "psycopg[binary]>=3.3",
    "pydantic>=2.14",
    "rapidfuzz>=3.14.6",
    "rfc8785>=0.1.4",
    "scipy>=1.18.1",
]

[project.scripts]
el = "electralens_engine.cli:main"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.86",
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["electralens_engine/models"]  # generated by `el models --write`

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# SQL statements read better unwrapped; every value in them is a bound parameter.
"electralens_engine/worker/jobs.py" = ["E501"]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
